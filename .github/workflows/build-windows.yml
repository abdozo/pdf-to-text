name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-desktop.txt pytest

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q tests_desktop

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Create build environment
        shell: pwsh
        run: python -m venv .venv-windows

      - name: Build application and Setup wizard
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { throw "Visual Studio C++ tools were not found." }
          & (Join-Path $VisualStudio "Common7\Tools\Launch-VsDevShell.ps1") -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Write installer checksum
        shell: pwsh
        run: |
          $Installer = Get-ChildItem dist\windows\installer\Warraq-Setup-*.exe | Select-Object -First 1
          if (-not $Installer) { throw "The Windows installer was not created." }
          $Hash = (Get-FileHash $Installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $($Installer.Name)" | Set-Content "$($Installer.FullName).sha256.txt" -Encoding ascii

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Warraq-Windows-${{ github.ref_name }}
          path: |
            dist/windows/installer/Warraq-Setup-*.exe
            dist/windows/installer/Warraq-Setup-*.exe.sha256.txt
            dist/windows/app/**
          if-no-files-found: error
          retention-days: 14
